<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steam library — screen study</title><style>
:root{color-scheme:dark;--bg:#18212d;--panel:#243244;--text:#f0f4f8;--muted:#acbdce;--blue:#78c9f2;--gold:#e8be65;--line:#4d6279;--red:#ffb6ad}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 'Segoe UI',system-ui,sans-serif}button,input,select{font:inherit}button,a,input,select,summary{touch-action:manipulation}button{min-height:44px;border:1px solid var(--line);border-radius:6px;padding:9px 15px;background:transparent;color:var(--text);cursor:pointer;font-weight:600}button:hover{background:#34475f}button.primary{background:var(--blue);border-color:var(--blue);color:#142332}button.gold{background:var(--gold);color:#242016;border-color:var(--gold)}button.danger{color:var(--red)}button:disabled{opacity:.6;cursor:not-allowed}button.small{font-size:14px;padding:7px 11px}a{color:var(--blue)}:focus-visible{outline:3px solid var(--gold);outline-offset:4px}h1,h2,h3,p{margin:0}h1{font-size:clamp(28px,4vw,40px);line-height:1.15;font-weight:650;letter-spacing:-.035em}h2{font-size:23px;line-height:1.3;font-weight:600}h3{font-size:18px;font-weight:600}p{max-width:70ch}p+p{margin-top:12px}.muted,small{color:var(--muted)}small{font-size:14px}.review{padding:12px max(20px,calc((100vw - 1200px)/2));background:#101822;border-bottom:1px dashed var(--line);display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:14px}.review strong{color:var(--gold)}.review label{display:flex;align-items:center;gap:10px}.review select{max-width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:9px}.skip{position:absolute;left:12px;top:-100px;padding:12px;background:var(--panel);z-index:20}.skip:focus{top:12px}.shell{max-width:1200px;margin:auto;padding:0 28px}header{display:flex;align-items:center;gap:30px;min-height:94px;border-bottom:1px solid var(--line)}.brand{font-size:21px;font-weight:700;white-space:nowrap}.brand span{color:var(--gold)}nav{display:flex;gap:6px;flex:1}nav button{border-color:transparent;font-weight:500}nav button[aria-current=page]{background:var(--panel);color:var(--blue)}main{padding:36px 0 64px;min-height:70vh}.title{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;margin-bottom:28px}.title p{margin-top:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.stack{display:grid;gap:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px}.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(260px,1fr);gap:24px}.split{display:grid;grid-template-columns:1fr 1fr;gap:24px}.notice{border-left:3px solid var(--gold);background:#2c3540;padding:16px 20px;border-radius:0 5px 5px 0}.notice.error{border-color:var(--red)}.notice p{margin-top:5px}.notice .actions{margin-top:14px}.intro{max-width:880px;margin:30px auto}.intro>p{font-size:19px;margin:16px 0 30px}.field{display:grid;gap:8px;margin:20px 0}input{width:100%;padding:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:5px;min-width:0}label{font-weight:600}.sample{border-left:3px solid var(--gold);padding-left:22px;align-self:center}.cover{height:130px;background:#31465b;display:flex;align-items:flex-end;padding:20px;border-radius:5px;position:relative;overflow:hidden}.cover:before{content:'';position:absolute;width:180px;height:180px;border:2px solid #7893a8;transform:rotate(40deg);right:12px;top:24px}.cover strong{position:relative;font-size:27px;text-shadow:0 2px 4px #18212d;line-height:1.2}.feature{display:grid;grid-template-columns:170px 1fr;gap:22px;align-items:center;margin:20px 0}.feature .cover{height:180px}.tag{display:inline-block;background:#34465a;border-radius:4px;padding:3px 8px;font-size:13px;color:var(--text)}.tag.gold{background:#4b422d;color:#ffda8e}.numbers{display:flex;flex-wrap:wrap;gap:28px;padding:20px 0;border-bottom:1px solid var(--line);margin-bottom:24px}.numbers strong{display:block;font-size:28px;line-height:1.2;font-variant-numeric:tabular-nums}.numbers span{font-size:14px;color:var(--muted)}.bar{height:9px;background:#15202d;border-radius:8px;overflow:hidden;margin:10px 0}.bar span{display:block;height:100%;background:var(--blue)}.bar.gold span{background:var(--gold)}.row{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);padding:17px 0}.row:last-child{border-bottom:0}.row .grow{flex:1;min-width:0}.row strong{display:block}.row .count{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.tile{width:44px;height:48px;flex:none;display:grid;place-items:center;background:#3b526a;color:#d6e9f4;border-radius:4px;font-weight:700;font-size:19px}.tile.gold{background:#4b422d;color:var(--gold)}.linechart{width:100%;height:110px}.legend{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}details{border-top:1px solid var(--line);padding-top:15px;margin-top:20px}summary{cursor:pointer;min-height:44px;align-content:center;color:var(--blue)}dl{display:grid;grid-template-columns:1fr auto;gap:10px;margin:16px 0}dt{color:var(--muted)}dd{margin:0;font-variant-numeric:tabular-nums}ul{padding-left:22px}li+li{margin-top:8px}.progress-head{display:flex;justify-content:space-between;gap:14px;align-items:baseline;margin:22px 0 8px}.progress-head strong{font-size:30px}.steps{list-style:none;padding:0;margin:24px 0}.steps li{display:flex;gap:12px;padding:10px 0}.steps span{color:var(--gold)}.toolbar{display:flex;gap:12px;margin:20px 0}.toolbar input{flex:1}.toolbar select{max-width:180px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:10px;border-radius:5px}.library-row{display:grid;grid-template-columns:44px minmax(0,1fr) 170px 110px;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}.library-row button{text-align:left;border:0;padding:0;min-height:44px;color:var(--blue)}.library-row .bar{margin:6px 0}.status{font-size:14px;color:var(--muted)}footer{border-top:1px solid var(--line);padding:20px 0 30px;display:flex;gap:20px;justify-content:space-between;font-size:14px;color:var(--muted)}dialog{width:min(600px,calc(100% - 32px));max-height:90vh;overflow:auto;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:28px}dialog::backdrop{background:#080f19d9}dialog h2{margin-bottom:14px}dialog .actions{margin-top:24px;justify-content:flex-end}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f0f4f8;color:#18212d;padding:14px 22px;border-radius:6px;max-width:calc(100% - 32px);z-index:30;box-shadow:0 4px 30px #0005}.empty{text-align:center;padding:40px}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.sub{margin-top:24px}.linkbutton{color:var(--blue)}.gamehead{display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:center}.gamehead .cover{height:160px}.check{color:var(--gold)}
button,input,.review select,.toolbar select{border-color:#7893a8}
@media(max-width:800px){.shell{padding:0 20px}header{flex-wrap:wrap;gap:8px;padding:18px 0}nav{order:3;flex-basis:100%;overflow:auto;gap:0}nav button{flex:1;padding:9px 11px;white-space:nowrap}.grid,.split{grid-template-columns:1fr}.title{flex-direction:column}.library-row{grid-template-columns:44px minmax(0,1fr) 100px;gap:12px}.library-row>.status{grid-column:2/-1}.review{padding:12px 20px}.review label{width:100%}.review select{flex:1;min-width:0}.feature{grid-template-columns:140px 1fr}.feature .cover{height:160px}.cover strong{font-size:23px}.sample{margin-top:12px}.intro{margin:0}.gamehead{grid-template-columns:120px 1fr}}

</style></head><body><a class="skip" href="#main">Skip to content</a><div class="review"><strong>Design prototype</strong><span>HTML layout study, not a shadcn-svelte implementation. Sample data; no Steam requests or storage changes.</span><label for="scenario">Review a screen<select id="scenario"><option value="welcome">First visit</option><option value="preflight">Import review</option><option value="running">Import in progress</option><option value="complete">Completed with gaps</option><option value="network">Network interruption</option><option value="paused">Paused / return to tab</option><option value="rate">Rate limit</option><option value="budget">API allowance review</option><option value="save">Storage failure</option><option value="overview" selected>Overview</option><option value="library">Library</option><option value="game">Game and achievements</option><option value="plan">My plan</option><option value="data">Data and backups</option><option value="restore">Restore preview</option><option value="private">Private profile</option><option value="conflict">Another tab</option><option value="empty">Empty library</option><option value="cooldown">Refresh cooldown</option><option value="unavailable">Live imports unavailable</option></select></label></div><div class="shell"><header><div class="brand"><span>◆</span> Steam library <small style="display:block;font-size:12px;font-weight:400">Sample library</small></div><nav aria-label="Main navigation"><button data-screen="overview">Overview</button><button data-screen="library">Library</button><button data-screen="plan">My plan</button><button data-screen="data">Backups</button></nav></header><main id="main" tabindex="-1"></main><footer><span>Saved in this browser. Keep a backup for another device.</span><button class="small" data-action="export">Export backup</button></footer></div><dialog id="dialog" aria-labelledby="dialog-title"></dialog><div id="toast" class="toast" role="status" hidden></div><script>
const $=s=>document.querySelector(s);let screen='overview',planned=true,dialogOrigin=null,timer,importState=null,importScope=203,allowance=1000,counted=224,processed=85;const gameNames=['Signal Harbor','The Clockwork Garden','Northbound','Ember Archive'];
const btn=(t,a,c='')=>`<button class="${c}" data-action="${a}">${t}</button>`;const nav=(t,s,c='')=>`<button class="${c}" data-screen="${s}">${t}</button>`;const bar=(n,c='')=>`<div class="bar ${c}" aria-hidden="true"><span style="width:${n}%"></span></div>`;const title=(h,p,a='')=>`<div class="title"><div><h1>${h}</h1><p class="muted">${p}</p></div>${a}</div>`;const notice=(h,p,a='',c='')=>`<div class="notice ${c}"><strong>${h}</strong><p>${p}</p>${a?`<div class="actions">${a}</div>`:''}</div>`;
function overview(){return title('A little closer to 100%.','Your saved library for Alex. Last saved: 12 November, 8:42 pm. A quick refresh checked 12 games; 191 kept their earlier results.',btn('Refresh library','refresh','primary'))+`<div class="numbers"><div><strong>203</strong><span>Games in library</span></div><div><strong>28</strong><span>Completed games</span></div><div><strong>1,842</strong><span>Achievements unlocked</span></div></div><div class="grid"><div class="stack"><section class="panel"><h2>Pick up where you left off</h2><div class="feature"><div class="cover"><strong>Signal<br>Harbor</strong></div><div><span class="tag gold">2 achievements left</span><h3 style="margin-top:12px">Your closest finish</h3><p class="muted">18 of 20 unlocked. Last played 11 November.</p>${bar(90,'gold')}<p><small>Completion counts achievements, not difficulty or time.</small></p></div></div><div class="actions">${nav('View remaining achievements','game','primary')}${nav('See my plan · 6 targets','plan')}</div></section><section><h2>Near the finish line</h2><p class="muted">Fewest remaining achievements first</p>${[['Northbound','12 / 16',75,'4 left'],['The Clockwork Garden', '31 / 36',86,'5 left']].map((g,i)=>`<div class="row"><div class="tile">${i?'C':'N'}</div><div class="grow"><strong>${g[0]}</strong><small>${g[3]}</small>${bar(g[2])}</div><div class="count">${g[1]}<br>${nav('View','game','small')}</div></div>`).join('')}</section></div><aside class="stack"><section class="panel"><h2>How current is this?</h2><p class="muted" style="margin-top:12px">Quick refresh checks new, changed and recently played games.</p><div class="row"><span class="grow">Checked within 7 days</span><strong>162 games</strong></div><div class="row"><span class="grow">Overdue for a check</span><strong>41 games</strong></div>${btn('Review full recheck','full')}<p style="margin-top:12px"><small>A quick refresh can leave overdue games unchanged.</small></p></section><section class="panel"><h2>Recent unlocks</h2><p class="muted" style="margin:10px 0">Achievement unlock dates · last 7 days</p><svg class="linechart" viewBox="0 0 280 110" role="img" aria-label="18 achievements unlocked across the last seven days: 2, 4, 0, 3, 5, 1, 3"><path d="M10 90H270" stroke="#4d6279"/><g fill="#78c9f2"><rect x="18" y="62" width="20" height="28"/><rect x="54" y="34" width="20" height="56"/><rect x="90" y="89" width="20" height="1"/><rect x="126" y="48" width="20" height="42"/><rect x="162" y="20" width="20" height="70"/><rect x="198" y="76" width="20" height="14"/><rect x="234" y="48" width="20" height="42"/></g></svg><div class="legend"><span>6 Nov</span><span>12 Nov</span></div><details><summary>Read chart values</summary><p>6 Nov: 2; 7 Nov: 4; 8 Nov: 0; 9 Nov: 3; 10 Nov: 5; 11 Nov: 1; 12 Nov: 3. Total: 18.</p></details></section></aside></div>`}
function welcome(){return `<div class="intro"><h1>Your games. A clearer next goal.</h1><p class="muted">See what you have unlocked, find your next achievement, and keep a plan in this browser.</p><div class="split"><section class="panel"><h2>Start with a public Steam profile</h2><form id="profile-form"><div class="field"><label for="profile">Steam profile link or SteamID</label><input id="profile" placeholder="https://steamcommunity.com/id/yourname" aria-describedby="profile-help" required><small id="profile-help">Your profile and game details need to be public. No Steam sign-in or personal API key.</small></div><button type="submit" class="primary">Check profile</button><p class="muted" style="margin-top:12px"><small>Checking the profile makes approximately 2–3 Steam calls. You will review the remaining work before starting the import.</small></p></form><details><summary>What gets sent and saved?</summary><p>We send your profile and game IDs to our server to request public Steam data. Your library and custom plan are saved in this browser. Clearing site data can remove them.</p></details></section><section class="sample"><h2>Have a backup already?</h2><p class="muted" style="margin:12px 0 18px">Restore a library backup or open a collector JSON file. Files are processed in your browser.</p><div class="actions">${nav('Choose a file','restore')}${nav('Try sample library','overview')}</div><p style="margin-top:24px"><small>Export a backup to move devices. There is no account or automatic sync.</small></p></section></div></div>`}
function preflight(full=false){return title(full?'Review full recheck':'Review your import',full?'Recheck achievement progress for all 203 games.':'Alex’s public library is ready. Review the work before continuing.')+`<div class="grid"><section class="panel"><h2>${full?'203 games to recheck':'203 games found'}</h2><dl><dt>${full?'Progress checks':'Games with achievements'}</dt><dd>${full?'203':'174'}</dd><dt>Estimated Steam API calls</dt><dd>${full?'203–527':'350–530'}</dd><dt>Initial import allowance</dt><dd>1,000 calls</dd></dl><p class="muted">An API call is one request to Steam. Games can need more than one. Estimates include progress and any missing or outdated achievement details.</p><details><summary>See what will be requested</summary><dl><dt>Profile and library lookup</dt><dd>2–3 calls</dd><dt>Achievement progress</dt><dd>Up to 203</dd><dt>Missing / stale achievement details</dt><dd>As needed</dd><dt>Missing / stale rarity data</dt><dd>As needed</dd></dl><p>We pause before the allowance is exceeded. There are no automatic retries. Earlier counted requests remain counted when you resume.</p></details><div class="actions sub">${nav(full?'Start full recheck':'Start import','running','primary')}${nav('Change profile','welcome')}${nav('Cancel','overview')}</div></section><aside class="stack">${notice('Keep this tab open while importing','Switching away pauses new requests. You can resume saved progress later. An already-started request may still finish.')}<section class="panel"><h3>Your current library stays available</h3><p class="muted" style="margin-top:10px">New results are saved separately until the import finishes. Your plan stays attached to its Steam profile.</p></section></aside></div>`}
const progressCopy={network:['Connection interrupted','The last request could not be confirmed. It stays counted, and no automatic retry will start. Saved work is safe; choose Resume when connected.'],running:['Importing your library','Keep this tab open while importing. Progress is saved as each batch finishes.'],paused:['Import paused','You can continue from the last saved batch. We will only retry unfinished work.'],rate:['Steam requests paused','Too many requests. Wait before choosing Resume; it will not resume automatically.'],budget:['Review more API calls','The next batch would exceed the current 1,000-call allowance. No new request has started.'],save:['Couldn’t save the latest results','New requests have stopped. Keep this tab open: 5 games are only in memory.']};
function progress(s){const [h,p]=progressCopy[s];return title(h,p)+`<div class="grid"><section class="panel"><h2>Alex’s library</h2><div class="progress-head"><strong>${importScope===8?3:processed} of ${importScope} games</strong><span class="muted">${s==='running'?'Processed':'Paused'}</span></div>${bar(importScope===8?37.5:processed/203*100)}<p class="muted">${s==='save'?'80 games saved to this browser; 5 unsaved.':processed===172?'Saved in this browser: 169 checked successfully; 3 unavailable. Unavailable games keep their prior values.':importScope===8?'Saved in this browser: 3 checked successfully. Remaining games are waiting.':'Saved in this browser: 82 checked successfully; 3 unavailable. Unavailable games keep their prior values.'}</p><ul class="steps"><li><span aria-hidden="true">✓</span> Profile and library found</li><li><span aria-hidden="true">${s==='running'?'●':'Ⅱ'}</span> Achievement progress and details ${s==='running'?'being checked':'paused'}</li><li><span aria-hidden="true">○</span> Updated dashboard available when complete</li></ul>${s==='rate'?notice('Try again after 8:45 pm','Example wait: 42 seconds remaining. After the wait, choose Resume yourself.'):s==='budget'?notice('982 calls counted so far','Around 90–130 more calls estimated. Continue adds up to 1,000 calls to this import’s allowance; it keeps the cumulative count.'):s==='save'?notice('Your previous complete library is safe','Retry saving before continuing, or export the unsaved results from memory. Closing this tab may lose those unsaved results.','','error'):''}<div class="actions sub">${s==='running'?btn('Pause import','pause','primary'):s==='rate'?'<button disabled>Resume after wait</button>':s==='budget'?btn('Allow up to 1,000 more calls','allow','primary'):s==='save'?btn('Retry saving','retry-save','primary'):nav('Resume import','running','primary')}${s==='save'?btn('Export unsaved results','export-memory'):btn('Discard import…','cancel')}</div><details><summary>Request and save details</summary><dl><dt>Calls counted, including uncertain results</dt><dd>${s==='budget'?982:counted}</dd><dt>Current allowance</dt><dd>${allowance.toLocaleString()}</dd><dt>Saved checkpoint</dt><dd>${s==='save'?80:importScope===8?3:processed} games</dd></dl><p>Saved results are reused. An unanswered request stays counted. Closing the tab stops future requests, but an in-flight request may finish.</p></details></section><aside class="stack"><section class="panel"><h2>Browse while you wait</h2><p class="muted" style="margin:12px 0">Your last complete library is still available. Moving between app screens keeps the import controller available.</p>${btn('View saved library','browse')}</section><section class="panel"><h3>What if I close the tab?</h3><p class="muted" style="margin-top:10px">A browser warning may appear during active work, but cannot prevent every interruption. Saved checkpoints let you resume next time.</p></section></aside></div>`}
function library(){return title('Your library','203 games · showing four sample rows')+`<div class="toolbar"><label class="sr" for="search">Search games</label><input id="search" type="search" placeholder="Search games"><label class="sr" for="filter">Filter games</label><select id="filter"><option value="all">All games</option><option value="close">Close to complete</option><option value="overdue">Overdue checks</option></select></div><p id="result-count" class="muted" role="status">4 sample games shown</p><div id="rows">${gameNames.map((n,i)=>`<div class="library-row" data-name="${n.toLowerCase()}" data-close="${i<3}" data-overdue="${i===3}"><div class="tile">${n[0]}</div><div>${nav(n,'game')}<div class="muted">${[42,18,9,3][i]} hours played</div></div><div><strong>${[18,31,12,2][i]} / ${[20,36,16,28][i]} unlocked</strong>${bar([90,86,75,7][i])}</div><span class="status">${i===3?'Overdue · checked 29 Oct':'Checked 12 Nov'}</span></div>`).join('')}</div><p id="no-results" hidden class="empty">No games match. Try a different name or filter.</p><div class="sub">${btn('Clear filters','clear-filters','small')}</div><p class="muted sub">Progress older than 7 days is marked overdue. Filters use saved data and make no Steam requests.</p>`}
function game(){return `${nav('Back to library','library','small')}<div class="gamehead sub"><div class="cover"><strong>Signal Harbor</strong></div><div><h1>Signal Harbor</h1><p class="muted" style="margin-top:10px">18 of 20 achievements unlocked · 42 hours played</p>${bar(90,'gold')}<p><small>Progress checked 12 November · rarity checked 11 November</small></p></div></div><div class="grid sub"><section><h2>2 achievements remaining</h2><div class="row"><div class="tile gold" aria-hidden="true">◇</div><div class="grow"><strong>A light in the fog</strong><p class="muted">Restore every lighthouse signal.</p><small>Unlocked by 8.4% of players</small></div>${btn(planned?'In my plan':'Add to plan','plan-toggle',planned?'':'primary')}</div><div class="row"><div class="tile gold" aria-hidden="true">◇</div><div class="grow"><strong>Safe passage</strong><p class="muted">Reach the harbor without losing a ship.</p><small>Unlocked by 5.1% of players</small></div>${btn('Add to plan','add','small')}</div><details><summary>18 unlocked achievements</summary><p class="muted">Examples: First signal, Open water, Homeward bound. Full list and search would use the existing achievement explorer.</p></details></section><aside class="panel"><h2>Make a small plan</h2><p class="muted" style="margin:12px 0">Save achievements you want to tackle next. Plans stay in this browser and are included in your backup.</p>${nav('Open my plan','plan')}<details><summary>How to read rarity</summary><p>Rarity is the share of Steam players who unlocked an achievement. It is not a difficulty rating or time estimate.</p></details></aside></div>`}
function plan(){return title('My plan','Alex’s targets · saved in this browser',btn('Export backup','export'))+`<div class="grid"><section class="panel"><h2>Next up</h2><div class="notice sub"><strong>Signal Harbor: 90% → 95% planned</strong><p>One selected target adds 5 percentage points if completed. This is achievement progress, not a time or difficulty forecast.</p></div><div class="row"><div class="tile gold" aria-hidden="true">◇</div><div class="grow"><strong>A light in the fog</strong><p class="muted">Signal Harbor · 8.4% unlocked</p></div>${nav('View game','game','small')}</div><div class="row"><div class="tile" aria-hidden="true">◇</div><div class="grow"><strong>Botanist</strong><p class="muted">The Clockwork Garden · 14.2% unlocked</p></div>${btn('Remove','remove','small')}</div><p class="muted sub">4 other targets in the full library. Sorting and detailed projections remain available in the existing planner.</p></section><aside class="stack"><section class="panel"><h2>Needs attention</h2><div class="row"><div class="grow"><strong>The old observatory</strong><span class="tag">Inactive</span><p class="muted">Game currently unavailable. Kept in your backup; excluded from projections.</p></div></div>${btn('Remove inactive target','remove','small')}</section><section class="panel"><h2>Completed</h2><p class="muted" style="margin:12px 0">First signal · unlocked 11 November</p>${btn('Remove completed target','remove','small')}<p style="margin-top:12px"><small>Targets are never silently removed.</small></p></section></aside></div>`}
function data(){return title('Your data','Saved in this browser. Export a backup to keep a copy or move devices.')+`<div class="grid"><section class="stack"><div class="panel"><h2>Backup and restore</h2><p class="muted" style="margin:12px 0 20px">One JSON file contains your library, plans for all saved profiles, preferences and freshness dates.</p><div class="actions">${btn('Export backup','export','primary')}${nav('Restore backup','restore')}</div><details><summary>What happens when I restore?</summary><p>We validate the file first and show exactly what will be replaced. Restoring replaces the full local dataset, including plans for other profiles. The file stays in your browser.</p></details></div><div class="panel"><h2>Other file formats</h2><p class="muted" style="margin:12px 0">Use a collector JSON file for library data, or a legacy plan file for its matching profile.</p><div class="actions">${btn('Open collector JSON','legacy')}${btn('Import plan file','plan-file')}</div></div></section><aside class="stack"><section class="panel"><h2>Stored here</h2><dl><dt>Active library</dt><dd>Alex · 203 games</dd><dt>Profiles with plans</dt><dd>Alex, Morgan</dd><dt>Last successful save</dt><dd>12 Nov, 8:42 pm</dd></dl><p class="muted">Clearing site data or losing this device can remove your plans. Steam cannot recreate them.</p></section><section class="panel"><h2>Clear browser data</h2><p class="muted" style="margin:12px 0">Remove the library, all profiles’ plans and preferences from this browser. Downloaded backups remain.</p>${btn('Delete local data…','delete','danger')}</section></aside></div>`}
function restore(){return title('Review backup replacement','Sample file: steam-library-2026-11-10.json · backup format v1')+`<div class="grid"><section class="panel"><h2>What will change</h2><dl><dt>Active library</dt><dd>Alex → Morgan</dd><dt>Games in restored library</dt><dd>146</dd><dt>Backup created</dt><dd>10 Nov, 7:16 pm</dd><dt>Morgan’s plan</dt><dd>Replaced · 8 targets</dd><dt>Alex’s plan</dt><dd>Removed · not in backup</dd><dt>Preferences</dt><dd>Replaced</dd></dl>${notice('This replaces your full local dataset','Your current library and all saved profile plans are replaced. Export your current data first if you want to keep it.')}<div class="actions sub">${btn('Export current data','export')}${btn('Replace local data…','restore-confirm','primary')}${nav('Cancel','data')}</div></section><aside class="panel"><h2>No Steam requests needed</h2><p class="muted" style="margin-top:12px">Restoring uses the file in this browser. Dates stay as they were in the backup. Nothing refreshes automatically.</p><details><summary>If the file cannot be restored</summary><p>Invalid files and unsupported newer formats are rejected before any data changes. Your current library stays intact.</p></details></aside></div>`}
function show(s,focus=true){screen=s;document.querySelector('nav').hidden=s==='welcome';document.querySelector('footer').hidden=s==='welcome';if(progressCopy[s])importState=s;if(s==='budget'){processed=172;counted=982;}$('#scenario').value=s;let html;if(s==='overview')html=overview();else if(s==='welcome')html=welcome();else if(s==='preflight')html=preflight();else if(progressCopy[s])html=progress(s);else if(s==='library')html=library();else if(s==='game')html=game();else if(s==='plan')html=plan();else if(s==='data')html=data();else if(s==='restore')html=restore();else if(s==='complete'){importState=null;html=title('Refresh complete, with gaps','Your updated library is saved in this browser. Some earlier results are still in use.')+`<div class="grid"><section class="panel"><h2>What changed</h2><dl><dt>Checked successfully this time</dt><dd>8 games</dd><dt>Kept earlier results</dt><dd>192 games</dd><dt>Unavailable; prior values retained</dt><dd>3 games</dd><dt>Still overdue for a check</dt><dd>41 games</dd></dl><p class="muted">203 games total. Overdue describes freshness and overlaps the categories above. Unavailable games were not treated as empty. Your plan targets remain intact.</p><div class="actions sub">${nav('View updated library','overview','primary')}${btn('Review unavailable games','gaps')}</div></section><aside class="panel"><h2>Nothing retries automatically</h2><p class="muted" style="margin-top:12px">Unsupported or private games keep a clear status. A later refresh is always your choice.</p></aside></div>`;}else if(s==='private')html=title('Profile details aren’t public','We couldn’t read this profile’s game details. Your saved library has not changed.')+notice('Check Steam privacy settings','Set your profile and game details to public, then choose Try again. You can also open a collector JSON file.',nav('Try again','welcome','primary')+nav('Use a file','data'));else if(s==='conflict')html=title('An import is active in another tab','Only one import can run at a time in this browser.')+notice('Continue in the other tab','You can still browse your last saved library here. No additional requests were started.',nav('View saved library','overview','primary'));else if(s==='empty')html=title('No games in this library','Steam returned a public library with no games. This is different from private or unavailable data.')+notice('Choose your next step','You can check another public profile or restore a backup.',nav('Use another profile','welcome','primary')+nav('Restore backup','restore'));else if(s==='cooldown')html=title('Your library was refreshed recently','Next quick refresh available at 2:42 am. Waiting does not start a refresh automatically.')+notice('Keep exploring saved data','You can browse your library or export a backup now.',nav('View library','library','primary'));else html=title('Live imports are unavailable','You can still open a file, restore a backup or explore sample data.')+notice('Use your local data','Existing saved libraries and plans remain available. No requests were sent to Steam.',nav('Open a file','data','primary')+nav('Try sample library','overview'));$('#main').innerHTML=html;if(importState&&!progressCopy[s]&&s!=='welcome')$('#main').insertAdjacentHTML('afterbegin',`<div style="margin-bottom:24px">${notice(importState==='running'?'Import in progress':'Import paused','The library below is the previous complete version. Saved import results are separate.',nav('View import',importState))}</div>`);document.querySelectorAll('nav button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.screen===s)b.setAttribute('aria-current','page')});if(focus){const heading=$('#main h1');heading.tabIndex=-1;heading.focus()}}
function toast(t){clearTimeout(timer);$('#toast').textContent=t;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,6000)}
function modal(h,body,buttons){dialogOrigin=document.activeElement;$('#dialog').innerHTML=`<h2 id="dialog-title">${h}</h2>${body}<div class="actions">${buttons}${btn('Cancel','close')}</div>`;$('#dialog').showModal();$('#dialog button:last-child').focus()}
function close(){ $('#dialog').close();if(dialogOrigin?.isConnected)dialogOrigin.focus() }
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();close()});
$('#dialog').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const items=[...$('#dialog').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled),select:not(:disabled),[tabindex="0"]')];const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.screen){if($('#dialog').open)close();show(b.dataset.screen);return}switch(b.dataset.action){case'export':toast('Prototype: backup download would start. Check your downloads to keep a copy.');break;case'export-memory':toast('Prototype: export would contain the current unsaved in-memory results, clearly labeled.');break;case'pause':show('paused');break;case'retry-save':toast('Prototype: saving succeeds; choose Resume to continue.');show('paused');break;case'allow':modal('Add another 1,000-call allowance?','<p>982 calls have been counted. The new total allowance would be 2,000 calls for this import. Estimated remaining work: 90–130 calls.</p>',btn('Add allowance and resume','allow-confirm','primary'));break;case'allow-confirm':close();allowance=2000;counted=982;show('running');toast('Prototype: allowance added; cumulative count retained.');break;case'cancel':modal('Discard this import?','<p>The previous complete library and your plan stay unchanged. Saved import progress will be discarded. An already-started request may still finish.</p>',btn('Discard import','cancel-confirm','danger'));break;case'cancel-confirm':close();importState=null;show('overview');toast('Prototype: import canceled; previous library retained.');break;case'browse':show('overview');break;case'refresh':modal('Review quick refresh','<p>Check new, changed and recently played games. An initial profile/library lookup uses approximately 2–3 Steam calls to determine which games need checking. Nothing else starts until you review the estimate.</p><p class="muted">41 overdue games may remain unchanged. Choose a full recheck separately to verify every game.</p>',btn('Check for changes','quick','primary'));break;case'quick':close();importScope=8;counted=3;show('preflight');$('#main').innerHTML=title('Review quick refresh','8 new, changed or recently played games selected.')+notice('About 10–26 Steam calls estimated','41 overdue games are not included unless selected by recent activity. Setup calls are included. Your last complete library stays available.',nav('Start quick refresh','running','primary')+nav('Cancel','overview'));break;case'full':importScope=203;counted=224;show('preflight');$('#main').innerHTML=preflight(true);break;case'plan-toggle':planned=!planned;show('game',false);document.querySelector('[data-action="plan-toggle"]').focus();toast(planned?'Added to sample plan.':'Removed from sample plan.');break;case'add':b.textContent='In my plan';b.disabled=true;toast('Added to sample plan.');break;case'remove':modal('Remove this target?','<p>This only removes the target from your local plan. Your Steam achievements do not change.</p>',btn('Remove target','removed','danger'));break;case'removed':close();toast('Prototype: target removal confirmed.');break;case'delete':modal('Delete all local data?','<p>This removes Alex’s library, plans for Alex and Morgan, preferences and saved import progress from this browser. Downloaded backups remain.</p><p class="muted">Export a backup before deleting if you want to keep your plans.</p>',btn('Export backup','export')+btn('Delete all local data','deleted','danger'));break;case'deleted':close();importState=null;show('welcome');toast('Prototype: local data deletion simulated.');break;case'restore-confirm':modal('Replace all local data?','<p>Morgan’s 10 November backup will replace this browser’s dataset. Alex’s plan will be removed, and Morgan’s plan replaced. Any active import will be stopped.</p>',btn('Replace local data','restored','primary'));break;case'restored':close();importState=null;show('data');toast('Prototype: restore confirmed. Sample dataset remains unchanged.');break;case'legacy':modal('Open a collector JSON file','<p>In the finished app, select a collector file here. Validate its profile and data, then preview the library replacement. Existing plans stay attached to their own profile.</p>',btn('Review sample collector file','collector-review'));break;case'collector-review':close();modal('Replace library from collector file?','<p>Sample file: Alex’s library, collected 10 November, 203 games. Only the active library snapshot will be replaced. Saved plans for Alex and Morgan stay attached to their existing profiles.</p><p>Any active import will stop. The file’s dates are retained; no Steam refresh starts.</p>',btn('Export current data','export')+btn('Replace library only','collector-replace','primary'));break;case'collector-replace':close();importState=null;show('overview');toast('Prototype: library replacement simulated. All profile plans retained.');break;case'plan-file':modal('Import a plan file','<p>The plan file must belong to the active Steam profile, Alex. A different profile is rejected without changing your plan.</p>',btn('Preview wrong-profile error','wrong-profile'));break;case'wrong-profile':close();toast('This plan belongs to Morgan. Switch to that profile before importing it. Your data is unchanged.');break;case'gaps':modal('3 games unavailable','<ul><li>Ember Archive: achievement data private.</li><li>Old observatory: unsupported achievement schema.</li><li>Winter transit: response exceeds the import size limit; use a collector file.</li></ul><p>Earlier values and plan targets are retained. These games will not retry automatically.</p>','');break;case'clear-filters':$('#search').value='';$('#filter').value='all';filterRows();$('#search').focus();break;case'close':close();break;}});
document.addEventListener('submit',e=>{if(e.target.id==='profile-form'){e.preventDefault();importScope=203;show('preflight')}});$('#scenario').addEventListener('change',e=>{clearTimeout(timer);$('#toast').hidden=true;importState=null;importScope=203;allowance=1000;counted=224;processed=85;show(e.target.value)});document.addEventListener('input',filterRows);document.addEventListener('change',e=>{if(e.target.id==='filter')filterRows()});function filterRows(){if(screen!=='library')return;const q=$('#search').value.toLowerCase(),f=$('#filter').value;let count=0;document.querySelectorAll('.library-row').forEach(r=>{r.hidden=!(r.dataset.name.includes(q)&&(f==='all'||r.dataset[f]==='true'));r.style.display=r.hidden?'none':'';if(!r.hidden)count++});$('#no-results').hidden=count>0;$('#result-count').textContent=`${count} sample ${count===1?'game':'games'} shown`}show('overview',false);
</script></body></html>
